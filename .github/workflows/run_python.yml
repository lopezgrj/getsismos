name: Run Python Script

# Defines what triggers the script
on:
  push:
    branches: [ main ]        # Runs every time you push to the main branch
    paths-ignore:
      - 'lista_de_sismos.txt' # Avoid re-trigger loop from bot commit of this file
  schedule:
    - cron: '*/30 * * * *'    # Runs every 30 minutes on GitHub servers
  workflow_dispatch:          # Allows you to click a "Run workflow" button manually

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest    # Uses the latest Linux runner environment

    steps:
      # 1. Download the repository files onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Specify your preferred Python version

      # 3. Install optional external dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Execute the Python script
      - name: Run script
        run: python getsismos.py     # Replace main.py with your script's filename

      # 5. Commit and push updates when new entries are found
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista_de_sismos.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update lista_de_sismos.txt"
            git push
          fi
      